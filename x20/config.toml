# Merge these keys; do not replace the complete user configuration.
model = "gpt-6-astra"
model_reasoning_effort = "high"
# No model_catalog_json: use the normal account/provider catalog.

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"

# Keep delegation triggers under this profile's AGENTS.md policy instead of
# Codex's effort-dependent built-in multi-agent mode developer message.
[features.multi_agent_v2]
multi_agent_mode_hint_text = ""

[features.context_management]
experimental_mode = true

# Retain Codex/provider memory defaults. Remove only old routing-profile
# extract_model/consolidation_model overrides; preserve unrelated memory policy.
