# Merge these keys; do not replace the complete user configuration.
# Replace YOUR_USER / path as described in install-lite.md.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_catalog_json = "C:/Users/YOUR_USER/.codex/models-lite.json"

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

# Keep delegation triggers under this profile's AGENTS.md policy instead of
# Codex's effort-dependent built-in multi-agent mode developer message.
[features.multi_agent_v2]
multi_agent_mode_hint_text = ""

[features.context_management]
experimental_mode = true

[memories]
extract_model = "gpt-5.6-luna"
consolidation_model = "gpt-5.6-luna"
